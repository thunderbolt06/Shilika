<section class="contact" id="contact">
  <div class="contact-inner">
    <span class="kicker light"><span class="kicker-num">/06</span> LET'S TALK</span>
    <h1 class="contact-title">Have a launch on the<br/>horizon? <em>Let's plot it.</em></h1>

    <div class="contact-grid">
      <div class="contact-form-wrap">
        <form id="contact-form" class="contact-form" novalidate>
          <div class="field">
            <label for="name">Your name</label>
            <input type="text" id="name" name="name" required autocomplete="name" />
            <span class="field-line"></span>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" />
            <span class="field-line"></span>
          </div>
          <div class="field">
            <label for="company">Company / Project</label>
            <input type="text" id="company" name="company" autocomplete="organization" />
            <span class="field-line"></span>
          </div>
          <div class="field">
            <label for="budget">Engagement type</label>
            <select id="budget" name="budget">
              <option value="One-off press release">One-off press release</option>
              <option value="Monthly retainer">Monthly retainer</option>
              <option value="TGE / Token launch">TGE / Token launch</option>
              <option value="Founder profiling">Founder profiling</option>
              <option value="KOL campaign">KOL campaign</option>
              <option value="Crisis comms">Crisis comms</option>
              <option value="Just exploring">Just exploring</option>
            </select>
            <span class="field-line"></span>
          </div>
          <div class="field field-full">
            <label for="message">What are you building?</label>
            <textarea id="message" name="message" rows="3" required></textarea>
            <span class="field-line"></span>
          </div>

          <div class="form-bottom">
            <button type="submit" class="submit-btn" data-magnet>
              <span class="btn-label">Send the brief</span>
              <span class="btn-arrow">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 16L16 4M16 4H7M16 4V13" stroke="currentColor" stroke-width="1.6"/></svg>
              </span>
            </button>
            <span id="form-status" class="form-status"></span>
          </div>
        </form>
      </div>

      <aside class="contact-aside">
        <div class="contact-channels">
          <a href="mailto:shilika498@gmail.com" class="channel" data-magnet>
            <span class="channel-key">Email</span>
            <span class="channel-val">shilika498@gmail.com</span>
          </a>
          <a href="https://t.me/shilika3" target="_blank" rel="noopener" class="channel" data-magnet>
            <span class="channel-key">Telegram</span>
            <span class="channel-val">@shilika3</span>
          </a>
          <a href="https://x.com/Shilika_jain" target="_blank" rel="noopener" class="channel" data-magnet>
            <span class="channel-key">Twitter / X</span>
            <span class="channel-val">@Shilika_jain</span>
          </a>
          <a href="https://www.linkedin.com/in/shilika/" target="_blank" rel="noopener" class="channel" data-magnet>
            <span class="channel-key">LinkedIn</span>
            <span class="channel-val">/in/shilika</span>
          </a>
          <a href="https://bit.ly/shilikajain" target="_blank" rel="noopener" class="channel channel-resume" data-magnet>
            <span class="channel-key">Resume / CV</span>
            <span class="channel-val">
              View &amp; download
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="margin-left:6px; vertical-align:-2px;"><path d="M3 11L11 3M11 3H5M11 3V9" stroke="currentColor" stroke-width="1.5"/></svg>
            </span>
          </a>
        </div>
      </aside>
    </div>

    <div class="calendly-block">
      <div class="calendly-block-header">
        <span class="card-label">PREFER TO TALK?</span>
        <h3 class="calendly-block-title">Book a 30-min intro call</h3>
        <p class="calendly-block-sub">I'll come prepped with a teardown of your current press footprint.</p>
      </div>
      <div class="calendly-inline-widget calendly-dark" id="calendly-widget"
        data-url="https://calendly.com/shilikajain/30min/?hide_gdpr_banner=1"
        style="min-width:280px;height:800px;color-scheme:light;"></div>
    </div>
  </div>
</section>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI SEO / AEO — The Complete Course</title>
<style>
  :root{
    --paper:#E9E6DF;
    --paper2:#E3DFD6;
    --card:#F4F2EC;
    --dark:#17150F;
    --dark2:#0d0c08;
    --ink:#16150F;
    --muted:#6c6a5f;
    --line:#15140f;
    --hair:#cbc7bc;
    --blue:#1f2ed0; 
    --blue2:#2a3af0;
    --purple:#7b7bf5;
    --orange:#df531e;
    --cream:#EDEAE2;
    --creammut:#9a978c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}

  .deck{max-width:1180px;margin:0 auto;padding:34px 26px 130px}

  /* ---------- top hint ---------- */
  .tophint{position:fixed;top:16px;right:26px;z-index:40;text-align:right;
    font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.12em;color:#8a877c;line-height:1.7}
  .tophint b{color:#55534a;font-weight:600}

  /* ---------- page / slide ---------- */
  .page{display:none}
  .page.active{display:block}

  .slide{
    position:relative;
    aspect-ratio:16/9;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:3px;
    padding:50px 58px 44px;
    display:flex;flex-direction:column;
    box-shadow:15px 17px 0 0 var(--dark);
  }

  /* dark variant (title + dividers) */
  .page[data-variant="dark"] .slide{background:var(--dark);border-color:var(--dark);color:var(--cream);
    box-shadow:15px 17px 0 0 rgba(0,0,0,.45)}
  .page[data-variant="dark"] .muted,.page[data-variant="dark"] .kick{color:#8f8c81}

  /* header row */
  .shead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px}
  .kick{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;color:#84817656;color:#7d7b70}
  .badge{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    border:1.5px solid var(--orange);color:var(--orange);border-radius:3px;padding:6px 11px;white-space:nowrap}
  .pnum{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;color:#9a978c}

  h1.st,h2.st{font-weight:800;letter-spacing:-.025em;line-height:1.03;margin:0 0 14px}
  h1.st{font-size:46px}
  h2.st{font-size:33px}
  .st .ac{color:var(--blue)}
  .page[data-variant="dark"] .st .ac{color:var(--purple)}
  .lead{font-size:18px;line-height:1.5;color:#514f47;max-width:82%;margin:0 0 6px}
  .page[data-variant="dark"] .lead{color:#b7b4a8}

  .body{flex:1;display:flex;flex-direction:column;justify-content:flex-start;min-height:0;gap:16px;padding-top:6px}

  /* ---------- title slide ---------- */
  .title-wrap{flex:1;display:flex;flex-direction:column;justify-content:center}
  .title-wrap .big{font-size:62px;font-weight:800;letter-spacing:-.03em;line-height:.98;margin:0}
  .title-wrap .big .ac{color:var(--purple)}
  .title-wrap .tag{font-size:19px;color:#b7b4a8;margin:22px 0 0;max-width:64%;line-height:1.45}
  .title-wrap .meta{margin-top:auto;display:flex;gap:40px;flex-wrap:wrap;
    font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.06em;color:#8f8c81;padding-top:34px}
  .title-wrap .meta b{color:var(--cream);font-weight:600}

  /* ---------- divider ---------- */
  .divi{flex:1;display:flex;flex-direction:column;justify-content:center}
  .divi .mno{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:#8f8c81}
  .divi .mt{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:14px 0 18px}
  .divi .mt .ac{color:var(--purple)}
  .divi .md{font-size:17px;color:#b7b4a8;max-width:74%;line-height:1.55}

  /* ---------- bullets ---------- */
  ul.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px}
  ul.pts>li{position:relative;padding-left:26px;font-size:17.5px;line-height:1.42;color:#2c2b24}
  ul.pts>li::before{content:"";position:absolute;left:0;top:.62em;width:9px;height:9px;background:var(--blue)}
  ul.pts b{color:#000;font-weight:700}
  .em{color:var(--blue);font-weight:700}
  .page[data-variant="dark"] ul.pts>li{color:#c9c6ba}
  .page[data-variant="dark"] ul.pts b{color:#fff}

  /* ---------- stat cells (reference style) ---------- */
  .cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1.5px solid var(--line)}
  .cell{padding:20px 18px;border-right:1.5px solid var(--line)}
  .cell:last-child{border-right:none}
  .cell-n{font-size:38px;font-weight:800;letter-spacing:-.02em;color:var(--blue);line-height:.95}
  .cell.neg .cell-n{color:var(--orange)}
  .cell-l{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.35;color:#6c6a5f;margin-top:10px;letter-spacing:.02em}

  /* ---------- cards / columns ---------- */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .cols.c3{grid-template-columns:1fr 1fr 1fr}
  .k{border:1.5px solid var(--line);border-radius:3px;padding:18px 20px;background:transparent}
  .k h3{margin:0 0 10px;font-size:16px;color:#000;letter-spacing:-.01em}
  .k ul{margin:0;padding-left:16px;color:#4a483f;font-size:14px;line-height:1.5}
  .k ul b{color:#000}
  .k.hi{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
  .k.warn{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
  .k .tt{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:8px}

  /* ---------- steps ---------- */
  .steps{display:flex;flex-direction:column;gap:10px}
  .step{display:flex;gap:16px;align-items:flex-start;border:1.5px solid var(--line);border-radius:3px;padding:13px 18px}
  .step .n{flex:0 0 30px;height:30px;border-radius:3px;background:var(--blue);color:#fff;font-weight:800;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-family:"SF Mono",monospace}
  .step .n.p{background:var(--purple);color:#141018}
  .step .n.o{background:var(--orange)}
  .step .tx{font-size:15.5px;line-height:1.4;color:#2c2b24}
  .step .tx b{color:#000}

  /* ---------- horizontal bar chart ---------- */
  .hb{display:flex;flex-direction:column;gap:11px;margin:2px 0}
  .hb-row{display:grid;grid-template-columns:190px 1fr auto;align-items:center;gap:14px}
  .hb-lab{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:13px;color:#3f3d35;text-align:right;letter-spacing:.01em}
  .hb-track{height:22px;background:#dcd8ce;border:1px solid var(--hair);position:relative;border-radius:2px}
  .hb-fill{height:100%;background:var(--blue);border-radius:1px}
  .hb-val{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:14px;font-weight:600;color:#000;min-width:60px}
  .hb-row.hi .hb-lab{color:#000;font-weight:700}
  .chart-cap{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a877c;margin-top:4px}

  /* ---------- vertical bar chart ---------- */
  .vb{display:flex;align-items:flex-end;gap:26px;padding:14px 6px 0;justify-content:center}
  .vb-col{display:flex;flex-direction:column;align-items:center;gap:12px}
  .vb-stack{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:9px}
  .vb-num{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:17px;font-weight:700;color:#000}
  .vb-bar{width:96px;background:var(--blue);border-radius:3px 3px 0 0}
  .vb-lab{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11.5px;color:#54524a;text-align:center;max-width:130px;line-height:1.3;letter-spacing:.02em}

  /* ---------- data table ---------- */
  .dtable{width:100%;border-collapse:collapse;font-size:14.5px}
  .dtable th{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:#6c6a5f;text-align:left;padding:9px 12px;border-bottom:1.5px solid var(--line);font-weight:600}
  .dtable td{padding:11px 12px;border-bottom:1px solid var(--hair);color:#2c2b24;vertical-align:middle}
  .dtable td.rowh{font-weight:700;color:#000}
  .dtable td b{color:var(--blue)}
  .dtable tr:last-child td{border-bottom:none}
  .inbar{display:inline-block;width:78px;height:9px;background:#dcd8ce;border-radius:5px;vertical-align:middle;margin-right:8px;overflow:hidden}
  .inbar>span{display:block;height:100%;background:var(--blue);border-radius:5px}

  .note-inline{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12px;color:#7d7b70;letter-spacing:.02em;margin-top:6px}
  .pill{display:inline-block;font-family:"SF Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    border:1.5px solid var(--blue);color:var(--blue);border-radius:20px;padding:5px 12px}

  /* ---------- NOTES drawer ---------- */
  .notes{
    display:none;margin-top:16px;border:1.5px solid var(--line);border-radius:3px;background:var(--card);
    padding:20px 24px;position:relative;box-shadow:9px 10px 0 0 var(--dark);
  }
  body.notes-on .page.active .notes{display:block}
  .notes .nh{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;letter-spacing:.2em;
    text-transform:uppercase;color:#8a877c;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .notes .nh::before{content:"";width:7px;height:7px;background:var(--orange)}
  .notes p{margin:0 0 10px;font-size:15px;line-height:1.62;color:#33322b}
  .notes p:last-child{margin-bottom:0}
  .notes b{color:#000}

  /* ---------- NAV pill ---------- */
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:50;
    background:var(--dark);color:var(--cream);border-radius:6px;
    display:flex;align-items:center;gap:20px;padding:12px 22px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .nav button{background:none;border:none;color:var(--cream);cursor:pointer;font-family:"SF Mono",monospace;
    font-size:12px;letter-spacing:.1em;text-transform:uppercase;line-height:1.3;text-align:center}
  .nav button:hover{color:#fff}
  .nav button:disabled{opacity:.35;cursor:default}
  .nav .arrow{font-size:13px;display:block}
  .nav .divr{width:1px;height:24px;background:#3a382f}
  .nav .dots{display:flex;gap:6px;align-items:center}
  .nav .dot{width:6px;height:6px;border-radius:50%;background:#4a483d}
  .nav .dot.on{background:var(--orange);transform:scale(1.15)}
  .nav .count{font-family:"SF Mono",monospace;font-size:12px;letter-spacing:.14em;color:#b7b4a8;min-width:72px;text-align:center}
  .nav .ntoggle.act{color:var(--orange)}
  .nav select{background:#26241c;color:var(--cream);border:1px solid #3a382f;border-radius:4px;
    font-family:"SF Mono",monospace;font-size:11px;padding:6px;max-width:150px}

  /* ---------- donut chart ---------- */
  .donutwrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .donut{width:150px;height:150px;border-radius:50%;flex:0 0 150px;position:relative}
  .donut::after{content:"";position:absolute;inset:22px;background:var(--card);border-radius:50%}
  .page[data-variant="dark"] .donut::after{background:var(--dark)}
  .dleg{display:flex;flex-direction:column;gap:8px}
  .dleg-row{display:flex;align-items:center;gap:10px;font-size:14px}
  .dleg-sw{width:11px;height:11px;border-radius:3px;flex:0 0 11px}
  .dleg-l{color:#3a3830;flex:1}
  .dleg-v{font-family:"SF Mono",monospace;font-weight:700;color:#000;min-width:52px;text-align:right}
  .page[data-variant="dark"] .dleg-l{color:#c9c6ba}
  .page[data-variant="dark"] .dleg-v{color:#fff}

  /* ---------- arrow-flow cards ---------- */
  .flow{display:flex;align-items:stretch;gap:6px}
  .flow-card{flex:1;border:1.5px solid var(--line);border-radius:3px;padding:16px 14px;background:transparent;min-width:0}
  .flow-n{font-family:"SF Mono",monospace;font-size:12px;color:var(--orange);font-weight:700;margin-bottom:6px}
  .flow-card h4{margin:0 0 8px;font-size:15px;color:#000}
  .flow-card p{margin:0;font-size:13px;line-height:1.4;color:#4a483f}
  .flow-arrow{display:flex;align-items:center;justify-content:center;font-size:20px;color:#9a978c;flex:0 0 18px}
  .page[data-variant="dark"] .flow-card h4{color:#fff}
  .page[data-variant="dark"] .flow-card p{color:#c9c6ba}
  .page[data-variant="dark"] .flow-arrow{color:#6a6858}

  /* ---------- big-letter cards (BID) ---------- */
  .bigcard{border:1.5px solid var(--line);border-radius:3px;padding:22px 16px;text-align:center}
  .bigletter{font-size:52px;font-weight:800;line-height:1;color:var(--blue);letter-spacing:-.02em}
  .biglabel{margin-top:8px;font-weight:700;font-size:15px;color:#000}
  .bigsub{margin:8px 0 0;font-size:13px;color:#4a483f;line-height:1.4}

  /* ---------- numbered gap cards ---------- */
  .gapgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .gapcard{border:1.5px solid var(--line);border-radius:3px;padding:14px 16px}
  .gapno{width:24px;height:24px;border-radius:50%;color:#fff;font-weight:800;font-size:12px;
    display:flex;align-items:center;justify-content:center;margin-bottom:8px;font-family:"SF Mono",monospace}
  .gapcard h4{margin:0 0 6px;font-size:14.5px;color:#000}
  .gapcard p{margin:0;font-size:12.5px;line-height:1.4;color:#4a483f}

  /* ---------- yes/no comparison cards ---------- */
  .jc{border:1.5px solid var(--line);border-radius:3px;padding:20px;text-align:center}
  .jc .icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    margin:0 auto 10px;font-size:19px;font-weight:800}
  .jc.yes .icon{background:#d7f5e9;color:#1f8f5f}
  .jc.no .icon{background:#fbdede;color:#c23b2e}
  .jc h4{margin:0 0 4px;font-size:15px;color:#000}
  .jc .yn{font-family:"SF Mono",monospace;font-size:11px;letter-spacing:.1em;font-weight:700;color:#6c6a5f}

  /* ---------- checklist (green/red rows) ---------- */
  .cl-h{font-size:15px;margin:0 0 8px;color:#000}
  .crow{display:flex;align-items:center;gap:9px;font-size:14px;color:#2c2b24;margin-bottom:6px}
  .cicon{flex:0 0 18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:#fff}
  .cicon.y{background:#2fae74}
  .cicon.n{background:#e0533d}

  /* ---------- line chart legend ---------- */
  .linelegend{display:flex;gap:22px;justify-content:center;margin-top:2px;font-family:"SF Mono",monospace;font-size:12px;color:#3a3830}
  .linelegend i{display:inline-block;width:14px;height:3px;margin-right:6px;vertical-align:middle;border-radius:2px}

  /* ---------- hub-and-spoke diagram ---------- */
  .hub{position:relative;height:220px;margin:6px 0}
  .hub-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:var(--card);border:1.5px solid var(--blue);border-radius:6px;padding:14px 20px;
    font-weight:800;font-size:15px;color:#000;box-shadow:0 4px 14px rgba(0,0,0,.08);white-space:nowrap;text-align:center}
  .hub-sat{position:absolute;background:var(--card);border:1.5px solid var(--line);border-radius:20px;
    padding:7px 14px;font-family:"SF Mono",monospace;font-size:12px;color:#3a3830;white-space:nowrap}
  .page[data-variant="dark"] .hub-center{background:var(--dark)}
  .page[data-variant="dark"] .hub-sat{background:var(--dark);color:#c9c6ba}

  /* ---------- fullscreen presentation mode ---------- */
  body.fs-mode{overflow:hidden;background:var(--dark)}
  body.fs-mode .tophint,body.fs-mode .nav{display:none!important}
  body.fs-mode .deck{max-width:none;margin:0;padding:0}
  body.fs-mode .page{position:fixed;inset:0;display:none;align-items:center;justify-content:center}
  body.fs-mode .page.active{display:flex}
  body.fs-mode .page .notes{display:none!important}
  body.fs-mode .slide{width:1128px;flex:none;transform-origin:center center}
  .nav button.act{color:var(--orange)}

  /* ---------- print / PDF ---------- */
  @media print{
    @page{size:A4 landscape;margin:10mm}
    body{background:#fff}
    .deck{max-width:none;margin:0;padding:0}
    .nav,.tophint{display:none!important}
    .page{display:block!important;page-break-after:always;break-after:page}
    .page:last-child{page-break-after:auto}
    .slide{aspect-ratio:auto;min-height:120mm;box-shadow:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .notes{display:block!important;box-shadow:none!important;page-break-inside:avoid;margin-top:6mm;border-left:4px solid var(--orange)}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="tophint mono">← → <b>move</b><br>N <b>notes</b></div>
<div class="deck" id="deck"></div>

<div class="nav">
  <button id="prev"><span class="arrow">←</span>Prev</button>
  <div class="divr"></div>
  <div class="dots" id="dots"></div>
  <div class="count"><span id="cur">01</span> / <span id="tot">00</span></div>
  <div class="divr"></div>
  <button id="ntoggle" class="ntoggle">Notes</button>
  <div class="divr"></div>
  <button id="next">Next<span class="arrow">→</span></button>
  <div class="divr"></div>
  <button id="fsbtn" title="Fullscreen (F)">⛶ Full</button>
  <select id="jump" title="Jump"></select>
</div>

<script>
/* ======================= chart / table helpers ======================= */
function HB(rows,o){o=o||{};
  var max=o.max!=null?o.max:Math.max.apply(null,rows.map(function(r){return r.v}));
  return '<div class="hb">'+rows.map(function(r){
    var pct=Math.max(2,(r.v/max)*100);
    var col=r.color||o.accent||'var(--blue)';
    return '<div class="hb-row'+(r.hi?' hi':'')+'">'
      +'<div class="hb-lab">'+r.l+'</div>'
      +'<div class="hb-track"><div class="hb-fill" style="width:'+pct+'%;background:'+col+'"></div></div>'
      +'<div class="hb-val">'+(r.d!=null?r.d:r.v)+(o.unit||'')+'</div></div>';
  }).join('')+'</div>'+(o.cap?'<div class="chart-cap">'+o.cap+'</div>':'');
}
function VB(rows,o){o=o||{};
  var max=o.max!=null?o.max:Math.max.apply(null,rows.map(function(r){return r.v}));
  var H=o.h||190;
  return '<div class="vb">'+rows.map(function(r){
    var px=Math.max(6,Math.round(r.v/max*H));
    var col=r.color||o.accent||'var(--blue)';
    return '<div class="vb-col"><div class="vb-stack"><div class="vb-num">'+(r.d!=null?r.d:r.v)+(o.unit||'')+'</div>'
      +'<div class="vb-bar" style="height:'+px+'px;background:'+col+'"></div></div>'
      +'<div class="vb-lab">'+r.l+'</div></div>';
  }).join('')+'</div>'+(o.cap?'<div class="chart-cap" style="text-align:center">'+o.cap+'</div>':'');
}
function TBL(head,rows,o){o=o||{};
  return '<table class="dtable"><thead><tr>'+head.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'
    +rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(i===0?' class="rowh"':'')+'>'+c+'</td>'}).join('')+'</tr>'}).join('')
    +'</tbody></table>'+(o.cap?'<div class="chart-cap">'+o.cap+'</div>':'');
}
function CELLS(items){
  return '<div class="cells">'+items.map(function(it){
    return '<div class="cell'+(it.neg?' neg':'')+'"><div class="cell-n">'+it.n+'</div><div class="cell-l">'+it.l+'</div></div>';
  }).join('')+'</div>';
}
function inb(v,max,col){return '<span class="inbar"><span style="width:'+Math.round(v/max*100)+'%;background:'+(col||'var(--blue)')+'"></span></span>';}

function DONUT(segs,o){o=o||{};
  var total=segs.reduce(function(s,x){return s+x.v},0);
  var acc=0,stops=[];
  segs.forEach(function(s){
    var start=acc/total*360; acc+=s.v; var end=acc/total*360;
    stops.push((s.color||'var(--blue)')+' '+start.toFixed(2)+'deg '+end.toFixed(2)+'deg');
  });
  var legend=segs.map(function(s){
    return '<div class="dleg-row"><span class="dleg-sw" style="background:'+(s.color||'var(--blue)')+'"></span>'

/* 0 TITLE */
{v:"dark",kick:"A visibility plan for your brand",badge:"AI SEO · AEO · GEO",title:"",type:"title",

{kick:"Introduction · Why now",title:'Small traffic, outsized value<span class="ac">.</span>',type:"x",

/* 3 what is AEO */
{kick:"Introduction · Definition",title:'What is Answer Engine Optimization<span class="ac">?</span>',type:"x",

 +'<div class="cols"><div class="k"><h3>Where it applies</h3><ul><li>Google AI Overviews &amp; AI Mode</li><li>ChatGPT · Perplexity</li><li>Gemini · Copilot</li></ul></div>'
 +'<div class="k"><h3>Also known as</h3><ul><li><b>GEO</b> — Generative Engine Optimization</li><li><b>LLMO</b> — Large Language Model Optimization</li><li>Same idea — we use <b>AEO</b></li></ul></div></div>',
 notes:'<p>AEO means making your content visible and useful to AI systems that deliver direct answers — Google AI Overviews, ChatGPT, Perplexity, Gemini, Copilot and any platform where AI generates a response and decides who to cite.</p><p>You\'ll hear the same idea called <b>GEO</b> (Generative Engine Optimization) or <b>LLMO</b> (Large Language Model Optimization). They mean essentially the same thing; this course uses AEO throughout.</p>'},

/* 4 SEO vs AEO */
{kick:"Introduction · SEO vs AEO",title:'You compete for a mention, not a position<span class="ac">.</span>',type:"x",
 body:TBL(["","Traditional SEO","AEO"],[
  ["The surface","A ranked list of blue links","One synthesized answer — no list"],
  ["You win by","Ranking in a <b>position</b>","Earning a <b>mention / citation</b>"],
  ["The path","See link → click → land on site","AI reads dozens of sources, decides who to name"],
  ["The rules","Ranking factors","Overlapping but different — consensus, freshness, entities"]]),
 notes:'<p>In traditional SEO you optimize a page to rank higher in a list of blue links and compete for positions. In AEO there is no list — the AI reads from many sources, synthesizes an answer, and decides who to mention or cite.</p><p>So you\'re competing for a <b>mention</b>, not a ranking position, and the rules for getting mentioned differ from the rules for ranking. Module 1 breaks down exactly how that works.</p>'},

/* 5 builds on SEO */
{kick:"Introduction · Mindset",title:'AEO builds on SEO — it doesn’t replace it<span class="ac">.</span>',type:"x",
 body:'<ul class="pts">'
 +'<li><b>SEO is the foundation; AEO future-proofs it.</b> Quality content, authority and technical health still matter.</li>'
 +'<li><b>Beware the zero-sum bias</b> (Ethan Smith, Graphite) — assuming something new rising means something old must fall.</li>'
 +'<li><b>2010 app-store analogy:</b> "mobile apps will kill the web." Apps boomed — and the web grew alongside them.</li>'
 +'<li><b>Proof it compounds:</b> one well-optimized site was mentioned <span class="em">7,470 times across 2,390 pages</span> in AI search with <b>zero</b> AEO effort — just solid SEO (source: Ahrefs research).</li></ul>',
 notes:'<p>This is not the end of SEO. The "AI will kill SEO" instinct is the <b>zero-sum bias</b> — the assumption that if something new rises, something old must fall. In 2010 people said mobile apps would kill the web; apps boomed and the web grew alongside them. AI search is likely the same story.</p><p>Proof it compounds from good SEO: one company\'s pages were mentioned 7,470 times across 2,390 pages in AI search <b>without any optimization for it</b> — purely from solid SEO and useful content. Imagine the upside once you optimize intentionally.</p>'},

/* ===== MODULE 1 ===== */
{v:"dark",kick:"",badge:"Module 01",title:"",type:"divider",
 body:'<div class="divi"><div class="mno">Module One</div><div class="mt">How AI Search<br><span class="ac">Actually Works.</span></div>'
 +'<div class="md">Three things you must understand: where AI gets information, how it expands your query, and how it decides who to cite. Get this and every tactic clicks into place.</div></div>',
 notes:'<p>Module 1 covers the mechanics of how AI search engines find, evaluate and cite content. Without the "why," every optimization tip feels like a random list of tactics. With it, the whole course becomes coherent.</p>'},

/* 8 two sources */
{kick:"1.1 · Finding & citing",title:'AI has two sources of information<span class="ac">.</span>',type:"x",
 body:'<div class="cols"><div class="k"><span class="tt">Source 1</span><h3>Training data</h3><ul><li>The huge corpus the model learned from — books, sites, PDFs, social, YouTube transcripts</li><li>Instant recall ("CEO of Apple → Tim Cook")</li><li><b>Static</b> — refreshed ~every 6 months; won\'t know last week\'s launch</li></ul></div>'
 +'<div class="k hi"><span class="tt" style="color:var(--blue)">Source 2</span><h3>Real-time retrieval (RAG)</h3><ul><li>When info is fresh or very specific, AI searches the web via APIs</li><li>Pulls pages, reads them, then generates the answer</li><li>Each retrieved page carries its own probability</li></ul></div></div>',
 notes:'<p>This distinction is the most important thing to understand. <b>Training data</b> is the static snapshot the model learned from — great for known facts, but updated only every six months or so, so it won\'t know something you launched last week.</p><p><b>Real-time retrieval</b> — retrieval-augmented generation (RAG) — is the second process: when the question needs fresh or very specific information, the AI fetches relevant pages from the web and generates its answer from them. These are the two doors through which your content reaches the model.</p>'},

/* 9 two levers */
{kick:"1.1 · Finding & citing",title:'Two ways to influence what AI says about you<span class="ac">.</span>',type:"x",
 body:'<div class="cols"><div class="k"><h3>1 · Get into the training data</h3><ul><li>Be mentioned so <b>widely and consistently</b> across the web that you\'re baked into the model itself</li></ul></div>'
 +'<div class="k hi"><h3>2 · Win the real-time retrieval</h3><ul><li>Make sure your content <b>shows up when AI searches live</b></li><li>This is <b>SEO</b> — ranking, backlinks and quality content decide what AI retrieves</li></ul></div></div>'
 +'<p class="note-inline">Your existing SEO skills map directly onto real-time retrieval.</p>',
 notes:'<p>Because there are two sources, there are two levers. First, be mentioned widely and consistently enough that your brand is baked into the <b>training data</b>. Second, make sure your pages surface during <b>real-time retrieval</b>.</p><p>The second lever is just SEO — ranking in Google, earning backlinks, creating quality content all directly influence whether AI picks up your pages when it searches live. Your existing SEO skills transfer straight over.</p>'},

/* 10 fan-out */
{kick:"1.1 · Query fan-out",title:'Query fan-out: one search becomes many<span class="ac">.</span>',type:"x",
 body:'<p class="lead" style="max-width:95%">Search went one-to-one → many-to-one → AI’s <span class="em">one-to-many</span>. A single prompt is fanned into dozens of sub-queries, run at once.</p>'
 +VB([{l:"Avg fan-out / prompt",v:10,d:"9–11"},{l:"High end",v:28,d:"28"},{l:'ChatGPT deep research<br>(one query)',v:28,d:"420",color:"var(--orange)"}],{max:28,h:170,cap:'"Plan a 5-day Japan trip" → Tokyo neighborhoods · Kyoto weather · is the JR Pass worth it?'}),
 notes:'<p>Older search was one-to-one, then many-to-one (different phrasings → same results). AI flips it to <b>one-to-many</b>: it fans a single prompt into dozens of sub-queries, runs them simultaneously, pulls from many sources, and merges everything into one answer.</p><p>Research (Seer Interactive) found an average of 9–11 fan-out queries per prompt, some as high as 28, and ChatGPT\'s deep-research mode ran 420 searches for a single red-phone-case query. The lesson: be relevant across an entire topic — even a niche — not just one keyword. A thin page that ignores subtopics loses to one that covers them.</p>'},

/* 11 fan-out caveats */
{kick:"1.1 · Query fan-out",title:'Use fan-out as a lens, not a keyword list<span class="ac">.</span>',type:"x",
 body:'<ul class="pts">'
 +'<li><b>You can see them</b> — AI brand-visibility tools expose an "AI responses" report showing fan-out queries for ChatGPT &amp; Perplexity.</li>'
 +'<li><b>They’re synthetic</b> — generated in the moment, not real searches.</li>'
 +'<li><b>Inconsistent</b> — the same prompt triggers different fan-outs each time.</li>'
 +'<li><b>Over 95% have zero search volume</b> — no human would ever type them.</li>'
 +'<li><b>So treat them as a window</b> into the subtopics AI thinks matter for a question.</li></ul>',
 notes:'<p>You can inspect fan-out queries in an AI brand-visibility tool\'s "AI responses" report for ChatGPT and Perplexity. But heed this caveat: these are <b>synthetic</b> — invented in the moment, inconsistent between runs, and 95%+ have zero search volume because no real person would type them.</p><p>Don\'t mistake them for a keyword list to optimize one-by-one. They\'re a <b>window into which subtopics the AI considers important</b> — which tells you what your topical coverage needs to include.</p>'},

/* 12 probabilistic */
{kick:"1.1 · How AI decides",title:'AI citations are probabilistic, not fixed<span class="ac">.</span>',type:"x",
 body:'<p class="lead" style="max-width:95%">"AI outputs are built on probabilities on top of probabilities on top of probabilities." — Patrick Stox</p>'
 +'<ul class="pts"><li><b>Training data</b> creates patterns → <b>retrieved pages</b> add signals → a <b>temperature</b> setting adds randomness.</li>'
 +'<li>Ask the same question 5× and you might be cited 3 of 5 times.</li>'
 +'<li>There’s no fixed slot — think <span class="em">AI visibility</span> (a probability distribution), not a leaderboard.</li></ul>',
 notes:'<p>Unlike stable search rankings, AI citations are probabilistic. Patrick Stox describes it as probabilities stacked on probabilities: training data forms patterns, retrieved pages add their own signals, and a temperature setting injects randomness so answers vary.</p><p>In practice, the same question asked five times may cite you three times, or mix you with competitors. That\'s why we talk about <b>AI visibility</b> — a probability distribution — rather than a fixed ranking.</p>'},

/* 13 what gets cited (HB) */
{kick:"1.1 · Patterns",title:'What raises your citation odds<span class="ac">.</span>',type:"x",
 body:DONUT([
   {l:"Rank in Google's top 10",v:76.1,d:"76.1%",color:"#1f2ed0"},
   {l:"Rank 11–100",v:9.5,d:"9.5%",color:"#7b7bf5"},
   {l:"Don't rank in top 100",v:14.4,d:"14.4%",color:"#df531e"}],{cap:"How AI-Overview citations rank in the SERPs · 1.9M citations studied"})
 +'<p class="note-inline"><b>Consensus</b> matters too — repeated, consistent mentions raise your probability. And AI-cited content runs ~25% fresher than a normal SERP.</p>',
 notes:'<p>There are clear patterns. <b>Consensus</b>: repeated, consistent mentions across the web raise your probability. <b>Freshness</b>: AI-cited content runs ~25% fresher than a normal SERP. <b>Authority</b>: 76% of AI Overview citations come from pages already in Google\'s top 10 — so SEO is the foundation, again.</p><p>Crucially it\'s not only about Google: 14% of AI-Overview-cited pages don\'t rank in Google\'s top 100 at all, and for platforms like ChatGPT the overlap is even lower. Brands weak in traditional search can still win in AI.</p>'},

/* 14 mechanics summary */
{kick:"1.1 · Summary",title:'The mechanics, tied together<span class="ac">.</span>',type:"x",
 body:FLOW([
   {n:"1",t:"Two Sources",d:"Training data + real-time web search."},
   {n:"2",t:"Fan-Out",d:"1 query → dozens of sub-queries."},
   {n:"3",t:"Merge &amp; Score",d:"Results from all sub-queries combined and ranked."},
   {n:"4",t:"Probabilistic Response",d:"Not fixed — based on consensus, freshness, authority."}]),
 notes:'<p>Putting it together: AI search pulls from training data and live web search, expands your query through fan-out, merges and scores the results, then generates a probabilistic answer shaped by patterns, consensus, freshness and authority.</p><p>This is why "earn more brand mentions" (consensus), "cover the whole topic" (fan-out) and "SEO first" (76% from top-10 pages) are the throughlines of everything that follows.</p>'},

/* 15 platforms not one thing */
{kick:"1.2 · Platform differences",title:'AI search is not one thing<span class="ac">.</span>',type:"x",
 body:CELLS([{n:"14%",l:"Overlap of the top-50 most-cited domains across AI Overviews, ChatGPT & Perplexity — only 7 of 50 on all three"}])
 +HB([
   {l:"Semantic similarity",v:86,d:"86%",hi:1},
   {l:"Word similarity",v:16,d:"16%"},
   {l:"Citation similarity",v:13.7,d:"13.7%",color:"var(--orange)"}],{max:100,cap:"AI Overviews vs AI Mode: response similarity"})
 +'<p class="note-inline">Same message, different sources: AI Overviews and AI Mode give 86% semantically similar answers, but share only 16% of exact wording and just 13.7% of citations.</p>',
 notes:'<p>Treating AI search as one channel leaves visibility on the table. Of the top-50 most-cited domains across AI Overviews, ChatGPT and Perplexity, only 7 appear on all three — a 14% overlap. Optimize for one platform and you can be invisible on the others.</p><p>Even two Google products diverge: AI Overviews and AI Mode give 86% semantically similar answers — same underlying message — but share only 16% of exact wording (word similarity) and just 13.7% of citations (citation similarity). Same message, completely different sources.</p>'},

/* 15b venn overlap */
{kick:"1.2 · Platform differences",title:'Different platforms cite different brands<span class="ac">.</span>',type:"x",
 body:VENN3({cap:"Overlap of the top-50 most-cited brands per AI assistant (source: Ahrefs research)"})
 +'<p class="note-inline">Only a handful of globally dominant brands (Wikipedia, Amazon, Google, Microsoft) get cited everywhere. Most brands — including Forbes, Reddit, NerdWallet and Shopify here — only break through on one or two platforms.</p>',
 notes:'<p>This is what that 14% overlap looks like in practice, using real names from the underlying study. Each AI assistant has its own citation "universe" — only the largest, most globally established brands (Wikipedia, Amazon, Google, Microsoft) get cited across all three. Everyone else sits in just one or two circles: health and reference sites like WebMD and Reddit skew toward AI Overviews; publishers like Forbes, Business Insider and Wired skew toward ChatGPT; niche finance and commerce sites like NerdWallet and Shopify skew toward Perplexity.</p><p>The practical takeaway: don\'t assume that ranking well or being cited on one assistant means you\'re covered everywhere. Check each platform separately in your brand-visibility tool.</p>'},

/* 16 platform preferences TABLE */
{kick:"1.2 · Platform differences",title:'What each platform prefers to cite<span class="ac">.</span>',type:"x",
 body:TBL(["Platform","Leans toward","Signature stat"],[
  ["AI Overviews","Authoritative &amp; Google-owned sources","YouTube ≈ <b>5.6%</b> of all citations; Reddit heavy"],
  ["ChatGPT","High-authority publishers &amp; media","Median DR of top pages = <b>90</b>"],
  ["Perplexity","Closest to classic Google search","<b>28.6%</b> of citations from Google’s top 10"],
  ["Google AI Mode","Video &amp; social","YouTube #1; cites Quora <b>3.5×</b> more than AIO"]]),
 notes:'<p>Each platform has its own index and biases. <b>AI Overviews</b> favor authoritative, established and Google-owned sources — YouTube alone is ~5.6% of citations, and Reddit features heavily. <b>ChatGPT</b> leans on high-authority publishers (median domain rating 90), partly from OpenAI\'s licensing deals, and overlaps Google\'s top 10 only 8–10% of the time.</p><p><b>Perplexity</b> is closest to classic Google — 28.6% of its citations come from Google\'s top 10, the fastest win if you already rank. <b>AI Mode</b> is dominated by YouTube and leans on Quora and social more than AI Overviews.</p>'},

/* 17 which platform */
{kick:"1.2 · Prioritization",title:'Which platform should you focus on<span class="ac">?</span>',type:"x",
 body:'<ul class="pts">'
 +'<li><b>Market share:</b> Google’s AI features + ChatGPT hold most AI-search volume today — prioritize <span class="em">Google + ChatGPT</span>.</li>'
 +'<li><b>SEO overlap:</b> already ranking? You have a head start with AI Overviews &amp; Perplexity — lean in.</li>'
 +'<li><b>The link is weakening:</b> "76% of AIO citations from Google’s top 10" has dropped to ~<span class="em">38%</span> as AIO pulls more from YouTube &amp; Reddit.</li>'
 +'<li><b>ChatGPT rewards off-site authority:</b> a Forbes feature or Reddit thread can matter more than your page’s ranking.</li></ul>',
 notes:'<p>Be strategic rather than optimizing for everything. Two factors: <b>market share</b> (Google + ChatGPT dominate volume) and <b>overlap with your existing SEO</b> (strong Google rankings help AI Overviews and Perplexity).</p><p>The connection is weakening — the share of AIO citations from Google\'s top 10 fell from ~76% to ~38% as AIO pulls more from YouTube and Reddit. And for ChatGPT, third-party authority (Forbes, Reddit, niche reviews) can matter more than your own ranking. Many top AI-cited domains get little traditional traffic — AI visibility is its own game. Inspect top domains per platform in an AI brand-visibility tool\'s cited-domains report.</p>'},

/* 18 three visibility types */
{kick:"1.3 · Types of visibility",title:'Winning comes in three forms<span class="ac">.</span>',type:"x",
 body:'<div class="cols c3"><div class="k hi"><span class="tt" style="color:var(--blue)">Best case</span><h3>1 · Cited &amp; linked</h3><ul><li>AI links to your page</li><li>Direct traffic; easiest to measure</li></ul></div>'
 +'<div class="k"><h3>2 · Mentioned, not linked</h3><ul><li>Named but not linked</li><li>Word-of-mouth at scale — users search for you next</li></ul></div>'
 +'<div class="k warn"><span class="tt">Blind spot</span><h3>3 · Not visible</h3><ul><li>Out of the conversation</li><li>Can\'t fix what you can\'t see</li></ul></div></div>',
 notes:'<p>Most people think AI visibility means one thing — a clickable link. It\'s actually a spectrum. <b>Cited &amp; linked</b> is the direct-traffic best case. <b>Mentioned but not linked</b> gives no click, but the user now knows your name and will often search for you — word-of-mouth at scale. <b>Not visible</b> means you\'re out of the conversation, which matters because you can\'t fix a gap you can\'t see.</p>'},

/* 19 link % by platform HB */
{kick:"1.3 · Types of visibility",title:'Only ~28% of mentions include a link<span class="ac">.</span>',type:"x",
 body:HB([
  {l:"Perplexity",v:51.6,d:"51.6%",hi:1},
  {l:"AI Mode",v:36.8,d:"36.8%"},
  {l:"ChatGPT",v:26.9,d:"26.9%"},
  {l:"AI Overviews",v:10.7,d:"10.7%",color:"var(--orange)"}],{max:60,cap:"Share of brand mentions that include a link, by platform"})
 +'<p class="note-inline">~7 of 10 times your brand appears in an AI answer, there’s no link attached.</p>',
 notes:'<p>On average only ~28% of AI mentions include a link — about 7 in 10 times your brand appears, there\'s no link. It varies widely: Perplexity 51.6%, AI Mode 36.8%, ChatGPT 26.9%, AI Overviews just 10.7%. If you mainly track AI Overviews, nearly 9 of 10 mentions are link-free.</p>'},

/* 20 mentions vs impressions TABLE with inline bars */
{kick:"1.3 · Types of visibility",title:'But links cluster on the biggest queries<span class="ac">.</span>',type:"x",
 body:TBL(["Platform","In % of mentions","In % of impressions (volume-weighted)"],[
  ["Perplexity", inb(51,80)+"51%", inb(78,80)+"<b>78%</b>"],
  ["Gemini", inb(16.8,80)+"16.8%", inb(71,80)+"<b>71%</b>"]],{cap:"Weighting mentions by search volume shows links land where the eyeballs are"})

/* 21 unlinked mentions strongest lever HB */
{kick:"1.3 · Types of visibility",title:'Unlinked mentions are the strongest lever<span class="ac">.</span>',type:"x",
 body:HB([
  {l:"Branded web mentions",v:0.664,d:"0.664",hi:1},
  {l:"Branded anchors",v:0.527,d:"0.527"},
  {l:"Branded search volume",v:0.392,d:"0.392"},
  {l:"Domain rating (DR)",v:0.326,d:"0.326"},
  {l:"Referring domains",v:0.295,d:"0.295"},
  {l:"Branded traffic",v:0.274,d:"0.274"},
  {l:"Number of backlinks",v:0.218,d:"0.218",color:"#b9b5aa"},
  {l:"Ad traffic",v:0.216,d:"0.216",color:"#b9b5aa"},
  {l:"Ad cost",v:0.215,d:"0.215",color:"#b9b5aa"},
  {l:"URL rating",v:0.18,d:"0.18",color:"#b9b5aa"},
  {l:"Number of site pages",v:0.17,d:"0.17",color:"#b9b5aa"}],{max:0.7,cap:"Correlation with AI-Overview visibility · 75,000-brand study (source: Ahrefs research)"})
 +'<p class="note-inline">LLMs learn associations ("peanut butter → jelly"). Every credible mention is another training example — it compounds.</p>',
 notes:'<p>Unlinked mentions are far from worthless. LLMs learn by reading the web, so every time your brand appears on a credible page tied to a topic, it\'s another training example — and repeated association ("peanut butter → jelly," "Tesla → electric cars") makes the model mention you more confidently.</p><p>A 75,000-brand study found <b>branded web mentions had the strongest correlation with AI visibility of any factor — 0.664</b> with AI Overviews. Behind it: branded anchors (0.527), branded search volume (0.392), domain rating (0.326), referring domains (0.295), branded traffic (0.274), backlinks (0.218), ad traffic (0.216), ad cost (0.215), URL rating (0.18), and — nearly irrelevant — the number of pages on your site (0.17). Even unlinked, being mentioned is the long game, and it compounds.</p>'},

/* 21b key takeaways by platform */
{kick:"1.3 · Types of visibility",title:'The same lever works differently per platform<span class="ac">.</span>',type:"x",
 body:TBL(["Factor","Where it matters most","Correlation"],[
   ["YouTube mentions","Strongest across ChatGPT, AI Mode &amp; AI Overviews","<b>0.737</b>"],
   ["YouTube mention impressions","Slightly weaker than mentions themselves","<b>0.717</b>"],
   ["Branded anchors","AI Mode's strongest authority signal","<b>0.628</b>"],
   ["Branded search volume","AI Mode","<b>0.466</b>"],
   ["Branded search volume","ChatGPT (much weaker)","0.352"],
   ["Domain rating (DR)","ChatGPT (much weaker)","0.266"],
   ["Number of site pages","Overall — near zero","0.194"],
   ["Brand overlap across assistants","How similarly ChatGPT, AI Mode &amp; AIO cite the same brands","<b>0.779</b>"]])
 +'<p class="note-inline">Content volume barely matters anywhere. But <b>which</b> factor matters most flips by platform — AI Mode rewards branded authority signals; ChatGPT is comparatively indifferent to them.</p>',
 notes:'<p>Zooming into the correlation data by platform reveals real nuance. YouTube mentions (0.737) outperform every other factor studied, and hold that top spot across ChatGPT, AI Mode, and AI Overviews alike — YouTube mention impressions are a close second at 0.717.</p><p>Google\'s AI Mode consistently shows the highest correlations with branded authority signals — branded anchors (0.628) and branded search volume (0.466). ChatGPT, by contrast, shows much weaker correlations with those same classic authority metrics — branded search volume only correlates at 0.352, and domain rating at just 0.266.</p><p>Two more things worth knowing: there is almost no relationship between how many pages a site has and its AI visibility (0.194) — publishing more thin pages doesn\'t help. And all three AI assistants largely mention the same brands, shown by a high output-overlap correlation of 0.779 — so most of the differentiation between platforms is in the details, not who gets mentioned overall.</p>'},

/* 22 response types */
{kick:"1.3 · Types of visibility",title:'Response type decides what matters for you<span class="ac">.</span>',type:"x",
 body:'<div class="cols c3"><div class="k"><h3>Step-by-step guides</h3><ul><li>"How to fix a leaky faucet"</li><li>Great for service &amp; how-to brands to be the recommended expert</li></ul></div>'
 +'<div class="k"><h3>Direct answers</h3><ul><li>"Capital of France?"</li><li>Builds authority for publishers — rarely a click</li></ul></div>'
 +'<div class="k"><h3>Video citations</h3><ul><li>YouTube among the most-cited domains</li><li>Creators’ videos surface directly</li></ul></div></div>'
 +'<p class="note-inline">In an AI brand-visibility tool, the gap between your <b>impressions</b> and your <b>mentions</b> is your opportunity.</p>',
 notes:'<p>Not all AI responses look the same, and the type that matters depends on your business. <b>Step-by-step</b> queries suit service businesses and how-to creators who want to be recommended as the expert. <b>Direct-answer</b> queries build authority for publishers but rarely earn a click. <b>Video citations</b> favor creators, since YouTube is one of the most-cited domains.</p><p>To see where you stand, search your site in an AI brand-visibility tool and filter by mentions, citations, impressions and share of voice. The gap between impressions and mentions is exactly where to focus — the subject of Module 2.</p>'},

/* ===== MODULE 2 ===== */
{v:"dark",kick:"",badge:"Module 02",title:"",type:"divider",
 body:'<div class="divi"><div class="mno">Module Two</div><div class="mt">Strategy: Research,<br><span class="ac">Targeting &amp; Gaps.</span></div>'
 +'<div class="md">Two phases: <b>Assess</b> where your brand stands today with a brand gap analysis, then <b>Discover</b> the keywords and prompts people actually use to find businesses like yours.</div></div>',
 notes:'<p>Module 2 turns mechanics into strategy in two phases. First <b>assess</b> — run a brand gap analysis to find exactly where you\'re missing. Then <b>discover</b> — build the keyword and prompt lists worth targeting. The audit you produce here becomes your personalized roadmap for the rest of the course.</p>'},

/* 24 map entities */
{kick:"2.1 · Brand gap analysis · Step 1",title:'Map your branded entities first<span class="ac">.</span>',type:"x",
 body:'<p class="lead" style="max-width:96%">A brand gap analysis measures the difference between where your brand <em>should</em> show up and where it <em>actually</em> does — across Google, AI results and the wider web.</p>'
 +'<div class="cols"><div class="k"><h3>Map every way you’re referred to</h3><ul><li>Main brand · sub-brands · product names</li><li>Proprietary features &amp; metrics</li><li>Associated personal brands</li><li><i>e.g.</i> your flagship product, a proprietary metric, a founder\'s personal brand…</li></ul></div>'
 +'<div class="k"><h3>Connect each to topics/attributes</h3><ul><li>LLMs infer meaning from how you’re described</li><li>Use keyword research for recurring modifiers — "affordable", "AI-powered", "enterprise-grade"</li><li>This becomes your benchmark</li></ul></div></div>',
 notes:'<p>Before finding gaps, get clear on what you\'re measuring. Map every way your brand is referred to: the main name, sub-brands, product names, proprietary features and metrics, and associated personal brands — each has its own visibility profile.</p><p>Then connect each entity to the topics and attributes people should associate with it. Search engines and LLMs infer meaning from how you\'re described, so use keyword research to surface the recurring adjectives and modifiers (affordable, AI-powered, enterprise-grade) that define what you should be found for.</p>'},

/* 25 run audit */
{kick:"2.1 · Brand gap analysis · Step 2",title:'Run the audit<span class="ac">.</span>',type:"x",
 body:TBL(["Metric","What it means"],[
  ["SEO baseline","Domain authority, referring domains, organic keywords, traffic &amp; value"],
  ["Mentions","Times your brand is <b>named</b> in AI responses"],
  ["Citations","Times your <b>site is cited</b> as a source"],
  ["Impressions","Estimated <b>exposure</b> of responses containing your brand"],
  ["AI Share of Voice","How often you’re mentioned <b>vs competitors</b>"]])
 +'<p class="note-inline">The power is in the filters: brand-mentioned-but-not-cited · competitor-mentioned-but-not-you · per-topic association.</p>',
 notes:'<p>Start with your traditional SEO baseline — domain authority, referring domains, organic keywords, traffic and traffic value. Then look at the AI citation metrics in an AI brand-visibility tool, where the real audit happens.</p><p>Track four things: mentions (times named), citations (times your site is the source), impressions (estimated exposure) and AI share of voice (vs competitors). The real power is in the filters — isolate prompts that mention you but don\'t cite you, queries where a competitor appears but you don\'t, and specific topics to see who AI associates them with.</p>'},

/* 26 six gaps TABLE */
{kick:"2.1 · Brand gap analysis · Step 3",title:'Identify gaps across six dimensions<span class="ac">.</span>',type:"x",
 body:GAPCARDS([
   {t:"Visibility gap",d:"You appear less often than competitors"},
   {t:"Narrative gap",d:"AI describes you wrong (e.g. “budget” when you’re premium)"},
   {t:"Topic gap",d:"Topics you should own but aren’t linked to"},
   {t:"Format gap",d:"Missing the content types AI cites (guides, video, comparisons)"},
   {t:"Web mentions gap",d:"Listicles / forums cite rivals, not you"},
   {t:"Demand gap",d:"Awareness searches where your name never comes up"}])
 +'<p class="note-inline">Framework: bucket your prompts into these six dimensions as you audit.</p>',
 notes:'<p>One useful framework groups brand gaps into six dimensions. <b>Visibility</b>: you appear less than competitors. <b>Narrative</b>: AI mis-positions you. <b>Topic</b>: subjects you should own but aren\'t associated with. <b>Format</b>: you don\'t produce the content types AI cites. <b>Web mentions</b>: third-party pages list competitors but not you — one of the strongest AI signals. <b>Demand</b>: awareness-stage searches where your name never surfaces.</p><p>Together these give a complete picture — not just how often you show up, but whether you show up for the right things, in the right way, in the right places. Bucket your prompts into these six as you audit.</p>'},

/* 27 prioritize */
{kick:"2.1 · Brand gap analysis · Step 4",title:'Prioritize: Fix, Build, or Influence<span class="ac">.</span>',type:"x",
 body:'<div class="cols c3"><div class="k"><h3>Fix</h3><ul><li>Improve what exists</li><li>Update a ranking page to close a topic gap — low effort, high impact</li></ul></div>'
 +'<div class="k"><h3>Build</h3><ul><li>Create new content/pages for uncovered opportunities</li></ul></div>'
 +'<div class="k"><h3>Influence</h3><ul><li>Strengthen off-site visibility via outreach &amp; mentions</li><li>Get onto a listicle all rivals are on</li></ul></div></div>'
 +'<p class="note-inline">Weigh each by: demand · brand credibility · citation likelihood. Start with quick wins. Repeat the whole audit for competitors.</p>',
 notes:'<p>You\'ll find more gaps than you can fix at once, so prioritize into three actions: <b>Fix</b> (optimize what exists — often the fastest win), <b>Build</b> (create new content) and <b>Influence</b> (earn off-site mentions).</p><p>Weigh each opportunity by potential demand, brand credibility and citation likelihood, and start with the quick ones. Then run the exact same audit on competitors to uncover topics and branded queries users connect to them more than you. A simple shared spreadsheet template works well to organize this and share with stakeholders.</p>'},

/* 28 research overview */
{kick:"2.2 · Keyword & prompt research",title:'Research for AEO: same list, different lens<span class="ac">.</span>',type:"x",
 body:'<div class="steps">'
 +'<div class="step"><div class="n p">1</div><div class="tx"><b>Build your list</b> — seeds + modifiers (ask AI for 10 seeds &amp; 5+ modifiers), expand using a keyword research tool\'s matching-terms report.</div></div>'
 +'<div class="step"><div class="n p">2</div><div class="tx"><b>Vet with BID</b> — Business potential, Intent, Difficulty.</div></div>'
 +'<div class="step"><div class="n p">3</div><div class="tx"><b>Apply the AI filter</b> — can AI fully satisfy this query alone?</div></div>'
 +'<div class="step"><div class="n p">4</div><div class="tx"><b>Find AI mention opportunities</b> — where AI names rivals, not you.</div></div>'
 +'<div class="step"><div class="n p">5</div><div class="tx"><b>Prompt research</b> — natural-language, conversational queries.</div></div></div>',
 notes:'<p>Keyword research for AEO overlaps heavily with SEO — half the battle is telling which opportunities are SEO and which are AEO. <b>Step 1</b>: build a list from seeds and modifiers (a quick prompt to your AI assistant produces 10 seeds and 5+ modifiers; expand via a keyword research tool\'s matching-terms report).</p><p>The next slides cover vetting with BID, the AI filter, finding mention opportunities and prompt research.</p>'},

/* 29 BID TABLE */
{kick:"2.2 · Step 2 · The BID formula",title:'Is a keyword worth targeting<span class="ac">?</span>',type:"x",
 body:BIGLETTERS([
   {letter:"B",label:"Business potential",sub:"If I rank #1, does it help the business?"},
   {letter:"I",label:"Intent",sub:"Does the SERP match my content type?"},
   {letter:"D",label:"Difficulty",sub:"Can I realistically rank?"}])
 +'<p class="note-inline">“best espresso machine under $500” beats “what is espresso” · e-commerce SERP + a blog post = mismatch · a few low-DR sites in the top 10 = an opening.</p>',
 notes:'<p>Some tempting keywords are traps. Before committing, run <b>BID</b>. <b>Business potential</b>: ranking #1 should actually help the business. <b>Intent</b>: Google the term and match your content type to what ranks; if every result is an e-commerce page, a blog post won\'t win. <b>Difficulty</b>: check referring domains and DR of the top pages — a few low-DR sites signal an opening.</p>'},

/* 30 AI filter VB */
{kick:"2.2 · Step 3 · The AI filter",title:'Can AI fully satisfy the query alone<span class="ac">?</span>',type:"x",
 body:VB([
   {l:"1 word",v:9.5,d:"9.5%"},{l:"2",v:9.9,d:"9.9%"},{l:"3",v:14,d:"14%"},{l:"4",v:19.5,d:"19.5%"},
   {l:"5",v:27.6,d:"27.6%"},{l:"6",v:36.6,d:"36.6%"},{l:"7+",v:46.4,d:"46.4%",color:"var(--orange)"}],
   {max:50,h:150,cap:"Share of SERPs with an AI Overview, by query length (words) · 146M SERPs analyzed"})
 +'<p class="note-inline">Also: <b>57.9%</b> of question queries trigger an AI Overview vs only <b>15.5%</b> of non-questions. Queries AI <b>can’t</b> satisfy stay open: <b>calculator · checker · generator · tool · template · finder · planner · maker</b>, or filter for transactional intent.</p>',
 notes:'<p>Even a BID-passing keyword can be a trap if the AI Overview answers it so well that no one clicks. AI Overviews show on ~21% of all keywords, but ~58% of question queries, 46% of 7+ word queries, and 99.9% of AIO-triggering keywords are informational. Google the term and ask: am I satisfied, or do I need to click?</p><p>The good news is a whole category AI hasn\'t touched — <b>tools and action queries</b>. Add modifiers like calculator, checker, generator, tool, template, finder, planner, maker, or filter for transactional intent. When someone needs to <i>do</i> something, the organic click is still there.</p>'},

/* 30b AIO by intent */
{kick:"2.2 · Step 3 · The AI filter",title:'AI Overviews are almost entirely an informational play<span class="ac">.</span>',type:"x",
 body:VB([
   {l:"Informational",v:99.9,d:"99.9%",hi:1},
   {l:"Commercial",v:5.5,d:"5.5%"},
   {l:"Transactional",v:1.2,d:"1.2%"},
   {l:"Navigational",v:0.1,d:"0.1%",color:"#b9b5aa"}],{max:100,h:170,cap:"Share of SERPs with an AI Overview, by keyword intent · 146M SERPs analyzed"})
 +'<p class="note-inline">Question queries trigger an AI Overview <b>57.9%</b> of the time, vs only <b>15.5%</b> for non-questions. If your keyword is commercial or transactional, AI is far less likely to steal the click.</p>',
 notes:'<p>Zoom out from query length to query intent and the pattern is even sharper: 99.9% of all keywords that trigger an AI Overview are informational in intent. Commercial queries trigger one just 5.5% of the time, transactional 1.2%, and navigational queries (searching for a specific brand or site) almost never (0.1%).</p><p>Question phrasing matters too — a question-style query triggers an AI Overview 57.9% of the time, versus only 15.5% for a non-question phrasing of the same topic. Put together with the query-length data: long, informational, question-phrased keywords are AI\'s favorite target — and exactly where you should apply the AI filter hardest before committing to a traditional SEO push.</p>'},

/* 31 mention opps + prompt research */
{kick:"2.2 · Steps 4 & 5",title:'Find mention opportunities, then research prompts<span class="ac">.</span>',type:"x",
 body:'<div class="cols"><div class="k"><h3>4 · AI mention opportunities</h3><ul><li><b>43.8%</b> of AI-cited pages are listicles (they build consensus)</li><li>In an AI brand-tracking tool: hover the platform → "others only" = mention gaps</li><li>Filter for <b>best · top · versus · review · alternative</b></li><li>~45% of AIO citations change on refresh (~every 2 days)</li></ul></div>'
 +'<div class="k"><h3>5 · Prompt research</h3><ul><li>People converse — they don’t type keywords</li><li>Same question 10 ways → 10 answers, 10 brand sets</li><li>Each prompt fans out into zero-volume sub-queries</li><li>Goal: visibility across the whole <b>topic</b></li></ul></div></div>',
 notes:'<p><b>Step 4:</b> if AI nails the answer, aim to be mentioned in the response. 43.8% of AI-cited pages are listicles (being on multiple lists compounds). In an AI brand-visibility tool, enter your site, hover the platform and click "others only" to reveal mention gaps, then filter for best/top/versus/review/alternative — that\'s your short-list. Because ~45% of AIO citations change on each refresh (about every two days), revisit regularly.</p><p><b>Step 5:</b> on ChatGPT, AI Mode and Perplexity people converse, not keyword-search. The same question phrased ten ways yields different brands, and every prompt fans out into zero-volume sub-queries. So you build visibility across the entire topic — which Module 3 delivers.</p>'},

/* ===== MODULE 3 ===== */
{v:"dark",kick:"",badge:"Module 03",title:"",type:"divider",
 body:'<div class="divi"><div class="mno">Module Three</div><div class="mt">Execution:<br><span class="ac">Do the Work.</span></div>'
 +'<div class="md">Four lessons of hands-on tactics — create content that gets cited, earn mentions on the pages AI already pulls from, optimize YouTube for AI, and clear the technical blockers.</div></div>',
 notes:'<p>Module 3 is where the work happens: creating content that gets cited, earning third-party mentions, optimizing YouTube for AI visibility (which most courses skip), and fixing the technical issues that stop AI from crawling you.</p>'},

/* 33 what AI cites HB */
{kick:"3.1 · Content that gets cited",title:'What AI actually cites — the data<span class="ac">.</span>',type:"x",
 body:HB([
  {l:"Freshness vs organic",v:25.7,d:"+25.7%",hi:1},
  {l:"ChatGPT pages updated in 2025",v:89.7,d:"89.7%"},
  {l:"…refreshed within 30 days",v:76,d:"76%"},
  {l:"Listicles among cited pages",v:43.8,d:"43.8%",color:"var(--purple)"},
  {l:"Word-count correlation",v:4,d:"0.04",color:"var(--orange)"}],{max:100,cap:"Length ≈ zero. Freshness & format win. (53.4% of cited pages are under 1,000 words)"}),
 notes:'<p>Three data-backed truths. <b>Length is irrelevant</b> — across 174,000+ cited pages the correlation between word count and citation is 0.04, and 53.4% of cited pages are under 1,000 words.</p><p><b>Freshness is powerful</b> — AI-cited content is 25.7% fresher than organic; 89.7% of ChatGPT\'s top-cited pages were updated in 2025 and 76% within the last 30 days. Make <i>meaningful</i> updates though — Google detects a bare date change. <b>Format matters</b> — 43.8% of ChatGPT citations are listicles, and data-driven stats and comparisons perform well because they map to how people ask AI.</p>'},

   ["Individual review / profile","1.8%","1.6%","1.1%","1.5%"],
   ["Category page","0.2%","2.5%","1.6%","1.4%"],
   ["Award","0.6%","1.8%","0.1%","0.8%"]],{cap:"Most prominent page types across ChatGPT responses · 750 top-of-funnel queries checked"})
 +'<p class="note-inline">Blog lists dominate everywhere, but product pages matter far more for product-category queries (19.1%) than for software (0.8%) or agency (~0%) queries.</p>',
 notes:'<p>The 43.8% listicle figure is an average — the real mix shifts a lot by query type. Across 750 top-of-funnel queries checked in ChatGPT, blog lists (best-of, top-X posts) dominate every category, from 39.5% of product queries up to 51.4% of software queries.</p><p>But look at product pages: they barely register for software queries (0.8%) or agency queries (basically none), yet make up 19.1% of citations for product queries — when someone\'s comparing physical or e-commerce products, ChatGPT is much more willing to cite the product page itself rather than a third-party review. Landing pages and non-blog lists follow a similar software/agency-heavy pattern. The takeaway: know which page type wins for <em>your</em> query type before you decide what to build.</p>'},

/* 33b length distribution */
{kick:"3.1 · Content that gets cited",title:'Length is a wash — freshness is not<span class="ac">.</span>',type:"x",
 body:VB([{l:"Under 1,000 words",v:53.4,d:"53.4%",hi:1},{l:"1,000–2,000 words",v:30.6,d:"30.6%"},{l:"Over 2,000 words",v:16,d:"16%",color:"var(--orange)"}],
   {max:60,h:150,cap:"Distribution of AI-Overview-cited page lengths"})
 +'<p class="note-inline">Average AI-cited page: <b>1,282 words</b> vs <b>1,188</b> for organic — nearly identical. <b>89.7%</b> of ChatGPT’s top-cited pages were last updated in 2025 alone.</p>',
 notes:'<p>Length isn\'t a lever either way — the average length of an AI-Overview-cited page (1,282 words) is actually slightly above the average organic-ranking page (1,188 words), but the correlation between length and citation is still near-zero (0.04 Spearman). Over half of cited pages (53.4%) are under 1,000 words, 30.6% are 1,000–2,000, and only 16% are over 2,000 — so both short and long pages get cited when they answer the question well.</p><p>Freshness is the real lever: 89.7% of ChatGPT\'s top-cited pages were last updated in 2025 alone, with a long tail of older pages (6.4% from 2024, and under 2% combined from every year before that).</p>'},

/* 33d freshness by year */
{kick:"3.1 · Content that gets cited",title:'Almost every cited page was touched this year<span class="ac">.</span>',type:"x",
 body:DONUT([
   {l:"2025",v:89.7,d:"89.7%",color:"#1f2ed0"},
   {l:"2024",v:6.4,d:"6.4%",color:"#7b7bf5"},
   {l:"2023 and earlier",v:3.9,d:"3.9%",color:"#df531e"}],{cap:"ChatGPT's most-cited pages by last-update year · 564 URLs analyzed"})
 +'<p class="note-inline">The "2023 and earlier" slice splits thin: 2023 (1.4%), 2022 (1.1%), then 2013–2021 combined add up to under 2%. AI-cited content averages 1,064 days since publication vs 1,432 days for organic — 25.7% fresher.</p>',
 notes:'<p>Break the freshness stat down by year and it\'s stark: 89.7% of ChatGPT\'s most-cited pages (out of 564 URLs analyzed) were last updated in 2025 alone. Add 2024 (6.4%) and you\'ve accounted for 96.1% of all citations — everything from 2023 and earlier combines for under 4%: 2023 (1.4%), 2022 (1.1%), 2021 (0.2%), 2020 (0.2%), 2019 (0.4%), 2017 (0.2%), 2014 (0.2%), and 2013 (0.4%).</p><p>The underlying freshness math: averaged across ChatGPT, Perplexity, Copilot and Gemini, cited URLs were last published 1,064 days ago (2.9 years) on average, versus 1,432 days (3.9 years) for organic search results — cited content is 25.7% "fresher" ((1432-1064)/1432). A page that hasn\'t been meaningfully updated in over a year is already starting from behind.</p>'},

/* 34 four principles */
{kick:"3.1 · Content that gets cited",title:'Structure content with four principles<span class="ac">.</span>',type:"x",
 body:'<div class="cols"><div class="k"><h3>BLUF · Bottom Line Up Front</h3><ul><li>Start each section with the answer</li><li>Humans scan in an F-pattern; LLMs weight the start &amp; end most</li></ul></div>'
 +'<div class="k"><h3>Atomic content</h3><ul><li>Every section stands alone</li><li>AI chunks unpredictably — self-contained sections survive any boundary</li></ul></div>'
 +'<div class="k"><h3>Entity-rich writing</h3><ul><li>Name brands, products, people, concepts</li><li>"[Your Product]\'s keyword report finds low-difficulty terms" &gt; "this tool helps with SEO"</li></ul></div>'
 +'<div class="k"><h3>Simple &amp; declarative</h3><ul><li>Short sentences, one idea each</li><li>Easier for people <em>and</em> AI to parse</li></ul></div></div>',
 notes:'<p>You don\'t write differently "for AI" — AI is trained on what humans find valuable, so content that serves readers well is content AI wants to cite. <b>BLUF</b>: lead each section with the answer; humans scan in an F-pattern and LLMs weight the beginning and end of a passage most. <b>Atomic content</b>: make every section self-contained, because AI chunks your page unpredictably (test: read an H2 out of context — does it still make sense?).</p><p><b>Entity-rich writing</b>: name specific brands, products, people and concepts. <b>Simple and declarative</b>: short sentences, one idea each — easy to parse and extract.</p>'},

/* 35 two levers */
{kick:"3.1 · Content that gets cited",title:'Brand your ideas · refresh sleeper pages<span class="ac">.</span>',type:"x",
 body:'<div class="cols"><div class="k"><h3>Label ideas with your brand</h3><ul><li>LLMs <b>flatten originality</b> — they absorb frameworks without credit</li><li>Name it: "the [Your Brand] Content Scoring Matrix," define it explicitly</li><li>Distribute widely — blog, social, podcasts, Reddit</li></ul></div>'
 +'<div class="k hi"><h3>Refresh "sleeper" pages</h3><ul><li>Once ranked, slowly declined — still hold backlinks &amp; authority</li><li>Your SEO tool\'s top-pages report → sort by traffic change</li><li>Confirm it’s a <b>content</b> issue, not a links issue, then update</li></ul></div></div>',
 notes:'<p>Two more levers. First, <b>label your ideas with your brand</b>: LLMs flatten original concepts into generic knowledge, so name your framework, define it explicitly, and distribute it everywhere — the more places it appears with your name, the harder it is to flatten.</p><p>Second, <b>refresh sleeper pages</b> — pages that once ranked and declined. They still hold backlinks and authority; they just need a real update, and since freshness drives AI citations this is one of the fastest wins. Find them in your SEO tool\'s top-pages report, sort by traffic change, and confirm the decline is a content problem before updating.</p>'},

/* 35b distribute widely */
{kick:"3.1 · Content that gets cited",title:'Distribute it everywhere<span class="ac">.</span>',type:"x",
 body:HUBSPOKE('[Your Brand]<br>Content Scoring Matrix',['Blog','LinkedIn','Newsletter','X','Podcast','Reddit'])
 +'<p class="note-inline" style="text-align:center">The more places your brand appears, the more AI has to learn from.</p>',
 notes:'<p>Once you\'ve named and defined your framework, distribute it everywhere — your blog, LinkedIn, a newsletter, X, your podcast, Reddit threads. Every additional surface where it appears with your brand attached is another training example that makes it harder for AI to flatten the idea into generic, uncredited knowledge.</p>'},

/* 36 three tiers TABLE */
{kick:"3.2 · Earning mentions",title:'Earn mentions in three tiers<span class="ac">.</span>',type:"x",
 body:HB([
   {l:"Google AI Overviews",v:0.7,d:"0.70",hi:1},
   {l:"Perplexity",v:0.4,d:"0.40"},
   {l:"ChatGPT",v:0.11,d:"0.11",color:"#b9b5aa"}],{max:0.8,cap:"Correlation between mentions on highly-cited pages and AI visibility, by platform"})
 +'<p class="lead" style="max-width:96%;margin-top:14px">Where you’re mentioned matters as much as how often — but the effect is far stronger for Google’s AI Overviews than for ChatGPT.</p>'
 +TBL(["Tier","Sources","Why it matters"],[
  ["1 · Editorial","Publications, review sites, authoritative listicles, creator reviews","Hardest to earn, most valuable — exactly what AI cites"],
  ["2 · Community / UGC","Reddit, Quora, niche forums","Reddit is heavily cited &amp; a core LLM training source"],
  ["3 · Own properties","Your YouTube, podcast, LinkedIn","All indexed — all potential AI sources"]]),
 notes:'<p>Much of AEO is off-site. Branded web mentions had the strongest correlation with AI Overview visibility, and mentions on <b>highly-linked pages</b> correlate 0.7 with AI-Overview visibility — but that same correlation drops to just 0.4 for Perplexity and only 0.11 for ChatGPT. Where you\'re mentioned matters, but the platform changes how much.</p><p><b>Tier 1</b> editorial mentions are hardest to earn but most valuable — exactly the pages AI loves (43.8% of ChatGPT citations are listicles/comparisons). <b>Tier 2</b> community sources matter more than people think — Reddit is heavily cited and a foundational training source; contribute real answers, never spam. <b>Tier 3</b> is your own properties — YouTube, podcast, LinkedIn — all indexed and all potential AI sources.</p>'},

/* 37 find + audit */
{kick:"3.2 · Earning mentions",title:'Find the pages — and watch your mentions<span class="ac">.</span>',type:"x",
 body:'<div class="cols"><div class="k"><h3>Find target pages</h3><ul><li>AI brand-tracking tool → <b>cited domains</b> report (which sites AI cites for your topics)</li><li>Target already-linked pages before they’re cited</li><li>Content-search tool: <b>title:best</b> / <b>title:versus</b> + <b>-yourbrand</b></li><li>Reddit: your SEO tool → reddit.com → organic keywords report</li></ul></div>'
 +'<div class="k warn"><h3>Audit mentions regularly</h3><ul><li>Mentions vanish when lists refresh</li><li>Track mention trends &amp; drops</li><li>Check <b>sentiment</b> &amp; accuracy</li><li>Misinfo? Fix your content first, then request a correction</li></ul></div></div>',
 notes:'<p>To find where to earn mentions, open an AI brand-visibility tool\'s cited-domains report to see the sites AI cites for your topics. You don\'t have to wait for a page to be cited — target already-linked pages that cover your topic. A content-search tool helps: search title:best or title:versus with a minus operator before your brand to surface listicles you\'re missing. For Reddit, run reddit.com through your SEO tool\'s organic keywords report, filter to top-5 rankings plus your niche.</p><p>Then audit continuously — mentions vanish when lists refresh, and AI can pick up wrong info. Track mention trends, watch for drops, and check sentiment/accuracy. If you spot misinformation, fix your own content first, then ask the publisher to correct theirs.</p>'},

/* 38 YouTube why HB */
{kick:"3.3 · YouTube optimization",title:'YouTube: the single strongest AI lever<span class="ac">.</span>',type:"x",
 body:HB([
  {l:"YouTube → ChatGPT visibility",v:0.737,d:"0.737",hi:1},
  {l:"Highly-linked pages → AIO",v:0.7,d:"0.70"},
  {l:"Branded web mentions → AIO",v:0.664,d:"0.664"}],{max:0.8,cap:"Correlation strengths · YouTube was the strongest factor in this research (source: Ahrefs)"})
 +'<p class="note-inline">#1 most-cited domain in AI Overviews · GPT-4 trained on <b>1M+ hours</b> of YouTube transcripts — AI learns from YouTube, not just cites it.</p>',
 notes:'<p>YouTube deserves its own lesson. It\'s the most-cited domain in Google\'s AI Overviews, YouTube mentions have a 0.737 correlation with ChatGPT visibility — the strongest of any factor studied — and GPT-4 was trained on over a million hours of YouTube transcripts. So YouTube is a platform AI both cites and learns from.</p><p>The process is three steps: find what already works (search hits), create videos engineered to rank, then layer in AI visibility.</p>'},

/* 38b search hit vs viral hit */
{kick:"3.3 · YouTube optimization",title:'Search hits compound. Viral hits fade<span class="ac">.</span>',type:"x",
 body:LINECHART()
 +'<p class="note-inline">A viral hit spikes once the algorithm exhausts interested viewers, then dies. A search hit compounds — steady Google + YouTube traffic, month after month — and is exactly what AI pulls from.</p>',
 notes:'<p>Before you pick a topic, understand the difference. A viral hit gets a spike of views that can keep spreading based on a viewer\'s interests, but once the algorithm exhausts the interested audience, it dies off. A search hit gets consistent traffic from both Google and YouTube search, month after month, because people are actively searching for that topic — and it keeps compounding.</p><p>Search hits are exactly the kind of videos AI is likely to pull from: if Google is already ranking a YouTube video for a keyword, there\'s a good chance AI Overviews will cite it too.</p>'},

/* 39 YouTube checklist */
{kick:"3.3 · YouTube optimization",title:'Target search hits, then optimize to rank<span class="ac">.</span>',type:"x",
 body:'<div class="cols"><div class="k"><h3>1 · Find search hits (not viral)</h3><ul><li>Consistent monthly traffic; viral spikes then dies</li><li>If Google ranks a video, AIO likely cites it too</li><li>Your SEO tool: <b>youtube.com/watch</b> → organic keywords → top-3 + niche</li></ul></div>'
 +'<div class="k"><h3>2 · The ranking checklist</h3><ul><li>Keyword <b>in the title</b> (save creativity for the thumbnail)</li><li>Description = real summary, keyword up top</li><li>Add <b>timestamps</b> → chapters can rank in Google</li><li><b>Say the keyword</b> aloud — Google understands audio</li><li>Match the format that already ranks</li></ul></div></div>'
 +'<p class="note-inline"><b>3 · Layer AI visibility:</b> in an AI brand-tracking tool\'s topics report, filter domain = youtube.com to see which queries pull YouTube in — then make those videos.</p>',
 notes:'<p><b>Step 1 — target search hits, not viral hits.</b> Viral videos spike then die; search hits earn steady Google + YouTube traffic and are what AI pulls from (if Google already ranks a video, AI Overviews likely cite it). Find them in your SEO tool: enter youtube.com/watch, open the organic keywords report, filter to top-3 plus your niche.</p><p><b>Step 2 — the ranking checklist:</b> keyword in the title, a real summary description with the keyword up top, timestamps (they become chapters that can rank in Google), actually say the keyword aloud since Google understands audio, and match the format already ranking. <b>Step 3 — layer AI visibility:</b> in an AI brand-tracking tool\'s topics report, filter the mentioned domain to youtube.com to see which queries pull YouTube in, then create for those topics. Every video is also potential training data.</p>'},

/* 40 technical robots */
{kick:"3.4 · Technical AEO",title:'Make sure AI can access you<span class="ac">.</span>',type:"x",
 body:'<p class="lead" style="max-width:96%"><span class="em">5.9%</span> of 140M websites block GPTBot — millions invisible to ChatGPT, often unintentionally.</p>'
 +TBL(["Crawler","Owner","Allow it"],[
  ["GPTBot · OAI-SearchBot","OpenAI","Yes"],["ClaudeBot","Anthropic","Yes"],["Google-Extended","Google","Yes"]])
 +'<p class="note-inline">Check <b>yourdomain.com/robots.txt</b>. Cloudflare’s "block AI bot traffic" is <b>on by default</b>. llms.txt: proposed, no major LLM uses it yet — don’t prioritize.</p>',
 notes:'<p>A lot of sites accidentally block AI: 5.9% of 140M websites block GPTBot, so they\'re invisible to ChatGPT. robots.txt tells crawlers what they can access — allow GPTBot and OAI-SearchBot (OpenAI), ClaudeBot (Anthropic) and Google-Extended (Google). Blocks often creep in from templates or platforms — notably Cloudflare\'s "block AI bot traffic" feature is enabled by default and edits your robots.txt.</p><p>Check yourdomain.com/robots.txt for disallow rules on those bots, or run a technical SEO audit tool, which flags them. As for llms.txt — a proposed robots.txt-style file — no major provider officially reads it yet, so it won\'t hurt but shouldn\'t be a priority.</p>'},

/* 41 technical five checks */
{kick:"3.4 · Technical AEO",title:'Five more technical checks<span class="ac">.</span>',type:"x",
 body:JSCARDS([{l:"Gemini",yes:true},{l:"Copilot",yes:true},{l:"ChatGPT",yes:false}])
 +'<p class="note-inline" style="text-align:center">Does the crawler render JavaScript? Fix JS-dependent pages with <b>server-side rendering</b> (test: disable JS, load your page).</p>'
 +'<ul class="pts" style="margin-top:14px">'
 +'<li><b>Page speed:</b> matters <em>more</em> for AI — slow pages get dropped before scoring during real-time retrieval.</li>'
 +'<li><b>Clean HTML:</b> proper H1→H2→H3, each section self-contained &amp; parseable.</li>'
 +'<li><b>Schema markup:</b> evidence mixed — keep it if you use it for SEO; don’t over-invest.</li>'
 +'<li><b>Hallucinated URLs:</b> AI sends visitors to 404s <span class="em">2.87×</span> more than Google (ChatGPT ~1% of clicks) — find them in analytics and <b>redirect</b>.</li></ul>',
 notes:'<p>Five checks. <b>JavaScript</b>: Gemini and Copilot render JS but ChatGPT\'s crawler doesn\'t, so JS-dependent SPAs look empty to it — server-side rendering fixes this; test by disabling JS. <b>Page speed</b>: matters more for AI because real-time retrieval fetches, parses and chunks on the fly, and slow pages get dropped before scoring. <b>Clean HTML</b>: logical H1→H2→H3 hierarchy with self-contained sections makes content parseable.</p><p><b>Schema markup</b>: evidence for AEO is mixed — keep it if you already use it for SEO but don\'t over-invest. <b>Hallucinated URLs</b>: AI assistants send visitors to 404s 2.87× more often than Google (ChatGPT ~1% of clicked URLs); find AI-referred 404s in analytics and redirect consistent ones to the closest real page.</p>'},

/* ===== MODULE 4 ===== */
{v:"dark",kick:"",badge:"Module 04",title:"",type:"divider",
 body:'<div class="divi"><div class="mno">Module Four</div><div class="mt">Measurement,<br><span class="ac">ROI &amp; Action Plan.</span></div>'
 +'<div class="md">AI visibility is harder to measure than SEO — but you’re not flying blind. Three tracking pillars, a progress framework, the real ROI case, and a plan you can start this week.</div></div>',
 notes:'<p>Execution means nothing if you can\'t tell it\'s working — but AI visibility is harder to measure than SEO. Module 4 gives you three tracking pillars, a way to judge progress, the ROI argument, and a step-by-step action plan.</p>'},

/* 43 pillar 1 */
{kick:"4.1 · Tracking · Pillar 1",title:'Track AI referral traffic (with a caveat)<span class="ac">.</span>',type:"x",
 body:CHECKLIST([
   {platform:"ChatGPT",rows:[{y:true,l:"Source links &amp; search results"},{y:false,l:"In-content links on paid accounts (noreferrer)"}]},
   {platform:"Claude",rows:[{y:true,l:"All link types"}]},
   {platform:"Perplexity",rows:[{y:true,l:"Web"},{y:false,l:"Desktop app"}]},
   {platform:"Copilot",rows:[{y:true,l:"Web"},{y:false,l:"Windows"}]},
   {platform:"Grok",rows:[{y:false,l:"Never passes referrer data"}]}])
 +'<p class="note-inline">Treat analytics as an undercount / trend. Set up: GA4 custom channel "AI traffic" (chatgpt.com · perplexity · gemini · copilot · claude.ai · deepseek) — or a privacy-friendly web analytics tool with a built-in AI channel.</p>',
 notes:'<p><b>Pillar 1 — AI referral traffic:</b> when someone clicks from an AI platform and lands on you. But attribution is leaky: some platforms strip referral data so visits appear as "direct." ChatGPT\'s search-result links pass referral, but in-content links on paid accounts use a no-referrer attribute and vanish; Claude tracks properly; Perplexity tracks on web but not desktop; Copilot on web but not Windows; Grok passes nothing. Treat what you see as an undercount and a trend.</p><p>To set up in GA4, create a custom channel group isolating AI sources (regex for chatgpt.com, perplexity, gemini.google.com, copilot.microsoft.com, claude.ai, deepseek.com). Simpler still, some free web analytics tools have a built-in AI channel and separate "unknown" from "direct" traffic.</p>'},

/* 44 pillars 2 & 3 */
{kick:"4.1 · Tracking · Pillars 2 & 3",title:'Bot analytics + self-reported attribution<span class="ac">.</span>',type:"x",
 body:'<div class="cols"><div class="k"><h3>2 · AI bot activity</h3><ul><li>Track crawlers, not humans — bots hit pages far more</li><li><b>Training bots</b> (GPTBot, Google-Extended) vs <b>citation bots</b> (ChatGPT-User, OAI-SearchBot — these drive referrals)</li><li>Bot-traffic analytics via a Cloudflare integration (free plan works)</li></ul></div>'
 +'<div class="k hi"><h3>3 · Self-reported attribution</h3><ul><li>Most AI impact never hits analytics (direct / branded search)</li><li>Add <b>"How did you hear about us?"</b> with AI options</li><li>~<b>3%</b> of conversions came from AI in one dataset — converting far above organic</li><li>If you do one thing — do this</li></ul></div></div>',
 notes:'<p><b>Pillar 2 — AI bot activity:</b> track the crawlers themselves, which hit your pages far more than humans, so the pages they hit most are your strongest citation candidates. Distinguish training bots (GPTBot, Google-Extended) from citation bots (ChatGPT-User, OAI-SearchBot) — the latter fetch pages in real time and drive referrals. Use a bot-traffic analytics tool via a Cloudflare integration (works on the free plan).</p><p><b>Pillar 3 — self-reported attribution</b> is the simplest and maybe most important. Much AI impact never appears in analytics: someone hears your name from ChatGPT, then types it directly or Googles it. Ask — add "How did you hear about us?" to signup/checkout. In one dataset, about 3% of conversions came from AI by self-report, converting well above organic (source: Ahrefs research). The three pillars work best together.</p>'},

/* 45 ROI VB */
{kick:"4.2 · ROI",title:'Small traffic, exceptional quality<span class="ac">.</span>',type:"x",
 body:VB([{l:"Organic conversion",v:1,d:"1×",color:"#b9b5aa"},{l:"AI conversion (case study)",v:23,d:"23×",color:"var(--blue)"},{l:"Vercel conversion",v:10,d:"10%",color:"var(--purple)"}],{max:23,h:170,cap:"AI visitors arrive pre-qualified · Tally credits AI with +$1M ARR (source: Ahrefs research)"})
 +'<p class="note-inline">AI referral ≈ <b>0.25%</b> of traffic and Google sends ~<b>210×</b> more — but AI traffic grew <b>9.7×</b> YoY (ChatGPT +85% since January). The bigger prize is brand awareness inside the answer.</p>',
 notes:'<p>On raw volume AEO looks small — AI referral is ~0.25% of total traffic, and Google still sends ~210× more than the top AI platforms combined. But quality flips the story: in one case study, AI visitors converted at 23× organic; Vercel sees 10% conversion from AI, and Tally calls AI its largest channel, crediting +$1M ARR. Volume is growing fast — 9.7× year over year, ChatGPT +85% since January.</p><p>The bigger prize is brand awareness <i>inside</i> the AI conversation: every recommendation is an impression that often leads to a later branded search. AEO isn\'t an alternative to SEO — it\'s a new layer on top, and building it early is a durable advantage.</p>'},

/* 46 progress + misinfo HB */
{kick:"4.2 · Progress & risk",title:'Measure progress — defend your facts<span class="ac">.</span>',type:"x",
 body:HB([
  {l:"Gemini",v:39,d:"39%",color:"var(--orange)"},
  {l:"Perplexity",v:37,d:"37%",color:"var(--orange)"},
  {l:"ChatGPT",v:7,d:"<7%",color:"var(--blue)"}],{max:50,cap:"Fake-brand test · how often each repeated planted misinformation"})
 +'<p class="note-inline">Track in your AI brand-visibility tool: <b>share of voice · cited domains · topic coverage · sentiment</b> (monthly check, quarterly deep audit). Fill every info gap with specific, official content — AI picks specific fiction over vague truth.</p>',
 notes:'<p>Revisit the baseline you set in Module 2 and track four things in an AI brand-visibility tool: AI share of voice vs competitors, cited domains (new sites citing you), topic coverage (gaps closing), and mention sentiment. Do a quick monthly check and a deeper competitive audit quarterly.</p><p>A warning: AI is vulnerable to misinformation. In one controlled test (Ahrefs research), a fake brand was created, contradicting sources were planted across a blog, Reddit and Medium, and eight AI platforms were asked about it — Gemini and Perplexity repeated the false claims in 37–39% of answers, while ChatGPT stayed under 7% and cited the official FAQ 84% of the time. The defense: fill every information gap with specific, official content (a real FAQ with numbers, dates, facts) — because AI tends to pick specific fiction over vague truth. Monitor, and on finding errors publish contradicting content, then get the third-party source corrected.</p>'},

/* 47 action plan */
{kick:"4.2 · Action plan",title:'Your AEO action plan<span class="ac">.</span>',type:"x",
 body:'<div class="cols"><div class="k"><span class="tt">This week</span><ul><li><b>1.</b> Check robots.txt for AI-bot access (~5 min)</li><li><b>2.</b> Set up AI analytics + "How did you hear about us?"</li><li><b>3.</b> Refresh your top 5–10 pages (real updates)</li><li><b>4.</b> Run your brand gap analysis in an AI visibility tool</li><li><b>5.</b> Identify your top 10 mention-earning targets</li></ul></div>'
 +'<div class="k hi"><span class="tt" style="color:var(--blue)">Ongoing</span><ul><li>Monthly AI-visibility check</li><li>Quarterly competitive audit</li><li>Rinse and repeat</li></ul></div></div>',
 notes:'<p>Bring it together. <b>This week:</b> (1) check robots.txt — five minutes, the most common blocker; (2) set up AI analytics and add "How did you hear about us?" so you measure from day one; (3) refresh your top 5–10 pages with meaningful updates; (4) run your brand gap analysis before optimizing; (5) identify your top 10 mention-earning targets via cited-domains and pages reports.</p><p><b>Ongoing:</b> a monthly AI-visibility check and a quarterly competitive audit — then rinse and repeat. Every step maps back to a lesson.</p>'},

/* 48 wrap */
{v:"dark",kick:"Course wrap-up",badge:"Fin",title:'Start before everyone else<span class="ac">.</span>',type:"x",
 body:'<ul class="pts">'
 +'<li><b>SEO is the foundation of AEO</b> — it builds on your work, it doesn’t replace it.</li>'
 +'<li><b>Brand mentions are the strongest lever</b> (0.664) — earn them across editorial, community &amp; your own channels.</li>'
 +'<li><b>Cover whole topics, not single keywords</b> — fan-out rewards breadth; freshness &amp; format beat length.</li>'
 +'<li><b>Each platform is its own ecosystem</b> — prioritize by market share and SEO overlap.</li>'
 +'<li><b>Measure with three pillars</b> — referral, bot analytics, self-attribution — and defend your brand’s facts.</li>'
 +'<li><b>The opportunity is early.</b> Small volume, exceptional conversion, fast growth — the biggest edge is starting first.</li></ul>',
 notes:'<p>To recap: SEO is the foundation AEO builds on; branded web mentions are the single strongest lever; you win by covering entire topics rather than single keywords, keeping content fresh and using cite-friendly formats; each AI platform is its own ecosystem to prioritize by market share and SEO overlap; and you measure with three complementary pillars while defending your brand\'s facts.</p><p>AI search is still early — the tools are evolving, the data is improving, and the opportunity is only growing. The biggest advantage you can have is simply starting before everyone else does. Thanks for taking the course.</p>'}
];

/* ======================= render ======================= */
var deck=document.getElementById('deck');
var MOD={0:"Introduction",1:"Module 1 · How AI Search Works",2:"Module 2 · Strategy",3:"Module 3 · Execution",4:"Module 4 · Measurement"};
function modOf(i){ // crude module tagging for the mini progress dots
  return 0;
}
S.forEach(function(s,i){
  var p=document.createElement('section');
  p.className='page';
  if(s.v)p.dataset.variant=s.v;
  var isTitle=(i===0);
  var head='<div class="shead"><div class="kick">'+(s.kick||'')+'</div>'
    +(s.badge?'<div class="badge">'+s.badge+'</div>':'<div class="pnum">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>')+'</div>';
  var title=s.title?('<'+(isTitle?'h1':'h2')+' class="st">'+s.title+'</'+(isTitle?'h1':'h2')+'>'):'';
  p.innerHTML='<div class="slide">'+head+title+(s.type==='title'||s.type==='divider'?s.body:'<div class="body">'+s.body+'</div>')+'</div>'
    +'<div class="notes"><div class="nh">Explanation — footnote</div>'+s.notes+'</div>';
  deck.appendChild(p);
});

/* ======================= nav ======================= */
var pages=[].slice.call(document.querySelectorAll('.page'));
var tot=pages.length, idx=0;
document.getElementById('tot').textContent=String(tot).padStart(2,'0');
var cur=document.getElementById('cur'),prevB=document.getElementById('prev'),nextB=document.getElementById('next'),
    jump=document.getElementById('jump'),dots=document.getElementById('dots'),ntoggle=document.getElementById('ntoggle');

// build compact dot progress (one dot per slide, capped visual)
S.forEach(function(s,i){var d=document.createElement('span');d.className='dot';dots.appendChild(d);});
var dotEls=[].slice.call(dots.children);

S.forEach(function(s,i){var o=document.createElement('option');o.value=i;
  var t=(s.title||(s.badge||'Title')).replace(/<[^>]+>/g,'');
  o.textContent=(i+1)+'. '+(t.length>34?t.slice(0,34)+'…':t);jump.appendChild(o);});

function show(n){
  idx=Math.max(0,Math.min(tot-1,n));
  pages.forEach(function(p,i){p.classList.toggle('active',i===idx);});
  cur.textContent=String(idx+1).padStart(2,'0');
  dotEls.forEach(function(d,i){d.classList.toggle('on',i===idx);});
  jump.value=idx;
  prevB.disabled=idx===0;nextB.disabled=idx===tot-1;
  window.scrollTo({top:0,behavior:'instant'});
  fitFullscreen();
}
prevB.onclick=function(){show(idx-1)};
nextB.onclick=function(){show(idx+1)};
jump.onchange=function(e){show(+e.target.value)};
ntoggle.onclick=function(){document.body.classList.toggle('notes-on');ntoggle.classList.toggle('act',document.body.classList.contains('notes-on'));};

/* ======================= fullscreen presentation mode ======================= */
var fsbtn=document.getElementById('fsbtn');
var REF_W=1128, REF_H=634;
function fitFullscreen(){
  if(!document.body.classList.contains('fs-mode'))return;
  var slide=document.querySelector('.page.active .slide');
  if(!slide)return;
  var k=Math.min(window.innerWidth/REF_W, window.innerHeight/REF_H)*0.94;
  slide.style.transform='scale('+k+')';
}
function enterFsMode(){
  document.body.classList.add('fs-mode');
  fsbtn.classList.add('act');
  fitFullscreen();
}
function exitFsMode(){
  document.body.classList.remove('fs-mode');
  fsbtn.classList.remove('act');
  var slide=document.querySelector('.page.active .slide');
  if(slide) slide.style.transform='';
}
fsbtn.onclick=function(){
  if(!document.fullscreenElement && document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(function(){});
  }
  if(document.body.classList.contains('fs-mode')){
    if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){});
    exitFsMode();
  } else {
    enterFsMode();
  }
};
document.addEventListener('fullscreenchange',function(){
  if(!document.fullscreenElement && document.body.classList.contains('fs-mode')) exitFsMode();
});
window.addEventListener('resize',fitFullscreen);

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(idx+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(idx-1);}
  else if(e.key==='Home'){show(0);}
  else if(e.key==='End'){show(tot-1);}
  else if(e.key==='n'||e.key==='N'){ntoggle.click();}
  else if(e.key==='f'||e.key==='F'){fsbtn.click();}
  else if(e.key==='Escape'&&document.body.classList.contains('fs-mode')){exitFsMode();}
});
show(0);
</script>
